default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: strip-ai-trailers
        name: strip Claude-Session and co-author trailers from the commit message
        entry: sed -i -e '/^Claude-Session:/d' -e '/^Co-Authored-By:/d' -e '/^Generated with/d'
        language: system
        stages: [commit-msg]

      - id: unit-tests
        name: JVM unit tests
        entry: ./gradlew --quiet :app:testReleaseUnitTest -PskipPuzzleTests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: puzzle-tests
        name: mots fleches generator test (2 min, only when the tool changed)
        entry: ./gradlew --quiet :app:testReleaseUnitTest --tests '*.PuzzleGeneratorTest'
        language: system
        pass_filenames: false
        files: ^app/src/(main/java/com/example/myapp/motsfleches/|main/assets/motsfleches_|test/java/com/example/myapp/motsfleches/)
        stages: [pre-push]
