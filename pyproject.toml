[project]
name = "cognitools-dataset"
version = "0.1.0"
description = "Generate the Undercover word pairs, the mots fléchés assets and the flags list for the CogniTools Android app"
requires-python = ">=3.10"
dependencies = [
    "fasttext",
    "faiss-cpu",
    "numpy",
    "pandas",
    "pillow",
]

[dependency-groups]
notebook = ["ipykernel", "notebook"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
